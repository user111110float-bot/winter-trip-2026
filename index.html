<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<title>聖誕跨年蜜月</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 左側依城市分段的日程欄 + 右側單日詳情；手機改為頂部橫向日期列。顏色代表過夜城市。 */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#18212E; --muted:#5D6878; --line:#DCE1E8; --soft:#E9EDF2;
  --accent:#18212E;
  --lap:#2F6DB0; --par:#A23E6A; --ven:#16807C; --flo:#A9741A; --rom:#B4472E;
  --ok:#2E7D4F; --warn:#9A6B00; --gyg:#D9480F; --bad:#C0392B;
  --f-display:"LXGW WenKai TC","Noto Serif TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151D; --surface:#18202B; --ink:#E8ECF2; --muted:#98A3B3; --line:#2A3443; --soft:#202A37; --accent:#E8ECF2;
  --lap:#7FB0E6; --par:#E386AE; --ven:#5CC7C1; --flo:#E2B25E; --rom:#EE8C72; --ok:#6CC892; --warn:#E3B84F; --gyg:#FF8A5B; --bad:#F07B6E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151D; --surface:#18202B; --ink:#E8ECF2; --muted:#98A3B3; --line:#2A3443; --soft:#202A37; --accent:#E8ECF2;
  --lap:#7FB0E6; --par:#E386AE; --ven:#5CC7C1; --flo:#E2B25E; --rom:#EE8C72; --ok:#6CC892; --warn:#E3B84F; --gyg:#FF8A5B; --bad:#F07B6E; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--c,var(--ink));outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.top{padding-block:22px 10px}
.top-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,4vw,34px);line-height:1.2;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.count{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.count b{display:block;font-family:var(--f-display);font-size:26px;color:var(--ink);line-height:1.1;font-weight:700}
.segbar{display:flex;gap:3px;margin-top:16px;height:8px;border-radius:4px;overflow:hidden}
.segbar span{background:var(--c);opacity:.85}
.seglegend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.seglegend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:1px}

/* tabs */
.tabs-wrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;padding-block:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:7px 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab .n{font-family:var(--f-mono);font-size:11px;margin-left:4px;opacity:.75}

/* day strip (mobile) */
.strip{display:none;overflow-x:auto;scrollbar-width:none;gap:6px;padding-block:8px 10px;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;scroll-snap-align:center;min-width:58px;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-align:center;line-height:1.25}
.chip .d{font-family:var(--f-mono);font-size:11px;color:var(--c)}
.chip .dt{font-weight:700;font-size:14px}
.chip .wk{font-size:11px;color:var(--muted)}
.chip[aria-current="true"]{background:var(--c);border-color:var(--c);color:var(--surface)}
.chip[aria-current="true"] .d,.chip[aria-current="true"] .wk{color:inherit;opacity:.9}

/* layout */
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;padding-block:20px 60px}
aside.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);align-self:start;max-height:calc(100vh - 80px);overflow-y:auto;padding-right:4px}
.sgroup{margin-bottom:14px}
.sgroup h3{font-size:12px;letter-spacing:.08em;color:var(--c);margin:0 0 4px 10px;font-weight:700}
.sgroup h3 small{color:var(--muted);font-weight:400;letter-spacing:0;margin-left:6px}
.srow{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;width:100%;text-align:left;padding:7px 10px;border-radius:10px;border-left:3px solid transparent}
.srow:hover{background:var(--soft)}
.srow .dt{font-family:var(--f-mono);font-size:12.5px;line-height:1.2}
.srow .dt small{display:block;color:var(--muted);font-size:11px}
.srow .nm{font-size:14px;line-height:1.35;min-width:0}
.srow[aria-current="true"]{background:var(--surface);border-left-color:var(--c);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.srow[aria-current="true"] .nm{font-weight:700}

/* day detail */
.day-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.dlabel{font-family:var(--f-mono);font-size:13px;color:var(--c);font-weight:600}
.dlabel span{color:var(--muted);font-weight:400;margin-left:8px}
.nav{display:flex;gap:6px}
.nav button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.nav button:disabled{opacity:.35;cursor:default}
.day h2{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.6vw,36px);line-height:1.2;margin:8px 0 2px;text-wrap:balance}
.theme{color:var(--muted);font-size:15px}
.routebtn{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:7px 14px;border-radius:999px;background:var(--c);color:var(--surface);text-decoration:none;font-size:14px;font-weight:500}
.routebtn span{font-size:12px;opacity:.85;font-family:var(--f-mono)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:18px}
.facts div{background:var(--surface);padding:10px 14px;min-width:0}
.facts dt{font-size:11.5px;color:var(--muted);letter-spacing:.06em}
.facts dd{margin:2px 0 0;font-size:13.5px;line-height:1.45}
.sec-t{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700;margin:28px 0 10px}
ol.plan{list-style:none;margin:0;padding:0;position:relative}
ol.plan li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--line)}
ol.plan li:first-child{border-top:0}
.tm{font-family:var(--f-mono);font-size:14px;font-weight:600;color:var(--c);font-variant-numeric:tabular-nums;padding-top:1px}
.pt{font-weight:700;font-size:16px;line-height:1.4}
.pd{color:var(--muted);font-size:14px;margin-top:2px}
.maplink{display:inline-block;font-size:12px;margin-top:5px;color:var(--c);text-decoration:none;border-bottom:1px dotted currentColor}
.hl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hl div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:0 8px;line-height:18px}
.hl b{display:block;margin-top:6px;font-size:15px}
.hl p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.tips{background:var(--soft);border-radius:12px;padding:12px 16px;font-size:14px}
.daytodo{display:flex;flex-direction:column;gap:6px}
.foot-nav{display:flex;justify-content:space-between;gap:10px;margin-top:32px;padding-top:16px;border-top:1px solid var(--line)}
.foot-nav button{text-align:left;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13px;max-width:48%}
.foot-nav button:last-child{text-align:right;margin-left:auto}
.foot-nav small{display:block;color:var(--muted);font-size:11.5px}

/* todo rows */
.todo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px}
.st{font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 9px;white-space:nowrap}
.st.todo-s{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.st.done-s{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.todo small{display:block;color:var(--muted);font-size:12.5px}
.todo .on{font-family:var(--f-mono);font-size:12px;color:var(--c)}
.todo button.on{border-bottom:1px dotted currentColor}

/* overview */
.ov{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:28px;padding-block:20px 60px}
.ovlist{display:flex;flex-direction:column}
.ovrow{display:grid;grid-template-columns:62px minmax(0,1fr) minmax(0,.9fr);gap:14px;padding:12px 10px;border-top:1px solid var(--line);text-align:left;width:100%;border-left:3px solid var(--c)}
.ovrow:hover{background:var(--surface)}
.ovrow .dt{font-family:var(--f-mono);font-size:13px;line-height:1.3}
.ovrow .dt small{display:block;color:var(--muted)}
.ovrow .city{font-weight:700;font-size:15px;line-height:1.35}
.ovrow .acts{color:var(--muted);font-size:13px;margin-top:2px}
.ovrow .stay{font-size:13px;color:var(--muted);line-height:1.45}
.ovrow .stay b{display:block;color:var(--ink);font-weight:500;font-size:11.5px;letter-spacing:.06em;color:var(--muted)}
.routebox{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);align-self:start}
.routebox svg{width:100%;height:auto;display:block}
.routebox .cap{font-size:12px;color:var(--muted);margin-top:6px}
.segsum{display:flex;flex-direction:column;gap:6px;margin-top:14px;font-size:13px}
.segsum div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:5px}
.segsum b{color:var(--c)}

.bk{padding-block:20px 60px;max-width:760px}
.bk .prog{display:flex;align-items:center;gap:12px;margin-bottom:16px;font-size:14px}
.bk .bar{flex:1;height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.bk .bar span{display:block;height:100%;background:var(--ok)}
.bk .list{display:flex;flex-direction:column;gap:6px}
.note{color:var(--muted);font-size:13px;margin-top:12px}
.lead{color:var(--muted);font-size:14px;margin:0 0 18px}
.st.wait-s{color:var(--muted);background:var(--soft)}
.tick{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:52px;padding:2px 0;border-radius:8px}
.tick .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);background:var(--surface);display:flex;align-items:center;justify-content:center}
.tick.on-done .box{background:var(--ok);border-color:var(--ok)}
.tick.on-done .box::after{content:"";width:6px;height:11px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tick:not(:disabled):hover .box{border-color:var(--ok)}
.tick:disabled{cursor:default;opacity:.85}
.tick em{font-style:normal;font-weight:400;margin-left:4px;font-family:var(--f-mono);font-size:10.5px}
.files{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.file{position:relative;display:inline-flex;align-items:center}
.file img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;background:var(--soft)}
.file .pdf{display:inline-block;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--soft);text-decoration:none}
.viewer{position:fixed;inset:0;z-index:100;background:rgba(10,12,16,.92);display:flex;flex-direction:column}
.viewer .vbar{display:flex;align-items:center;gap:8px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));color:#fff;font-size:14px}
.viewer .vbar b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.viewer .vbar button{color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.viewer .vbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 12px 24px;display:flex;flex-direction:column;align-items:center;gap:12px}
.viewer .vbody img,.viewer .vbody canvas{max-width:100%;height:auto;background:#fff;border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.viewer .vmsg{color:#ddd;font-size:14px;margin-top:40px;text-align:center}
.fdel{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--ink);color:var(--surface);font-size:12px;line-height:20px}
.fdel.armed{background:var(--bad);color:var(--surface);white-space:nowrap}
.up{display:inline-flex;align-items:center;font-size:12.5px;padding:5px 10px;border-radius:8px;border:1px dashed var(--muted);color:var(--muted);cursor:pointer}
.up:hover{border-color:var(--ok);color:var(--ok)}
.up input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.upmsg{flex-basis:100%;font-size:12px;color:var(--bad)}
.upnote{font-size:13px;color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:10px;padding:8px 12px;margin:0 0 12px}
.todo.is-done .itm{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent);color:var(--muted)}
.gyg{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin-top:6px;padding:4px 12px;border-radius:999px;border:1px solid var(--gyg);color:var(--gyg);text-decoration:none;font-size:13px;font-weight:700}
.gyg span{font-weight:400;font-size:12px;color:var(--muted)}
.gyg:hover{background:color-mix(in srgb,var(--gyg) 10%,transparent)}
.todo small b{font-weight:700;color:var(--ok)}
.todo small b.soon{color:var(--warn)}
.legs{display:flex;flex-direction:column;gap:8px}
.leg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.leg-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.mode{font-size:11.5px;font-weight:700;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:0 8px;line-height:19px;white-space:nowrap}
.route{font-weight:700;font-size:15px;flex:1;min-width:0}
.leg .on{font-family:var(--f-mono);font-size:12px;border-bottom:1px dotted currentColor}
.how{font-size:14px;margin-top:5px}
.ltip{font-size:13px;color:var(--muted);margin-top:3px}
.trgroup{margin-bottom:22px}
.trgroup h3{font-size:13px;letter-spacing:.06em;color:var(--c);margin:0 0 8px}
.trgroup h3 small{color:var(--muted);font-weight:400;margin-left:8px;font-family:var(--f-mono);letter-spacing:0}
.prep{display:grid;grid-template-columns:minmax(0,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.prep div{background:var(--surface);padding:10px 14px}
.prep dt{font-weight:700;font-size:14.5px}
.prep dd{margin:2px 0 0;font-size:14px;color:var(--muted)}
/* 搶票 */
.ugsec{margin-bottom:26px}
.ugsec h3{font-size:15px;margin:0 0 2px;display:flex;align-items:baseline;gap:10px}
.ugsec h3 small{font-weight:400;font-size:12.5px;color:var(--muted)}
.ugsec .ugd{margin:0 0 10px;font-size:13px;color:var(--muted)}
.ug-now h3{color:var(--bad)}
.ug-watch h3{color:var(--warn)}
.ug-later h3{color:var(--ok)}
.todo .why{display:block;font-size:12.5px;font-weight:700;color:var(--warn);margin-bottom:2px}
.ug-now .todo .why{color:var(--bad)}
.ug-later .todo .why{color:var(--muted);font-weight:400}
/* 收藏指南 */
.ctabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.ctab{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.ctab[aria-selected="true"]{border-color:var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.ctab .n{font-family:var(--f-mono);font-size:11px;margin-left:4px;opacity:.75}
.refs{display:flex;flex-direction:column;gap:10px}
.ref{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:12px;padding:12px 14px}
.ref-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.ref-top b{font-size:15.5px;flex:1;min-width:0}
.ref .src{display:inline-block;margin-top:6px;font-size:13px;color:var(--c);border-bottom:1px dotted currentColor;text-decoration:none}
.ref ul{margin:8px 0 0;padding-left:18px;font-size:14px}
.ref li{margin:3px 0}
.ref li small{color:var(--muted)}
.ref .pend{margin-top:8px;font-size:13px;color:var(--warn)}
.ref .rdays{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px}
.ref .rn{margin-top:6px;font-size:13.5px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;background:var(--soft);border-radius:12px;padding:14px 16px}
.need{font-size:11px;font-weight:700;margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--ink)}

@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr);padding-top:12px}
  aside.side{display:none}
  .strip{display:flex}
  .ov{grid-template-columns:minmax(0,1fr)}
  .routebox{position:static;order:-1;max-width:420px}
  .routebox svg{max-height:300px}
}
@media (max-width:560px){
  .facts{grid-template-columns:minmax(0,1fr)}
  .hl{grid-template-columns:minmax(0,1fr)}
  ol.plan li{grid-template-columns:58px minmax(0,1fr);gap:10px}
  .ovrow{grid-template-columns:54px minmax(0,1fr)}
  .ovrow .stay{grid-column:2}
  .count{text-align:left}
  .nav{display:none}
  .todo{grid-template-columns:auto minmax(0,1fr)}
  .todo .on{grid-column:2;justify-self:start}
}
@media (prefers-reduced-motion:no-preference){
  .day{animation:fade .25s ease}
  @keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
}
.daymap{height:300px;border-radius:12px;border:1px solid var(--line);margin-top:16px;z-index:0;background:var(--soft)}
.ovmapbox{height:360px;margin-top:20px}
.pin span{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;color:#fff;font:700 12px/1 var(--f-mono);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.leaflet-container{font-family:var(--f-body)}
.arrow span{display:block;width:0;height:0;margin:1px 0 0 2px;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:13px solid;filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1px #fff)}
.maphint{font-size:12px;color:var(--muted);margin-top:6px}
.arrow.big span{border-top-width:8px;border-bottom-width:8px;border-left-width:15px}

let _maps = [];
function drawMaps(){
  _maps.forEach(m => m.remove()); _maps = [];
  if (!window.L) return;
  const css = getComputedStyle(document.documentElement);
  const mk = (el, seq, color) => {
    // seq: ordered stops [{ll, name, how}], how = how you reach this stop (flight/train/car/walk/boat)
    const m = L.map(el, {scrollWheelZoom:false, attributionControl:true, worldCopyJump:false});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:18, attribution:'&copy; OpenStreetMap'}).addTo(m);
    const E = L.CRS.EPSG3857;
    const arrow = (pt, deg, size) => L.marker(E.unproject(pt), {interactive:false, keyboard:false, icon:L.divIcon({className:'arrow' + (size ? ' big' : ''), html:`<span style="transform:rotate(${deg}deg);border-left-color:${color}"></span>`, iconSize:[18,18], iconAnchor:[9,9]})}).addTo(m);
    const ang = (a, b) => Math.atan2(-(b.y - a.y), b.x - a.x) * 180 / Math.PI;
    for (let i = 0; i < seq.length - 1; i++) {
      const a = seq[i].ll, b = seq[i + 1].ll, how = seq[i + 1].how || 'walk';
      if (a[0] === b[0] && a[1] === b[1]) continue;
      const pa = E.project(L.latLng(a)), pb = E.project(L.latLng(b));
      if (how === 'flight') {
        const dx = pb.x - pa.x, dy = pb.y - pa.y, len = Math.hypot(dx, dy);
        const c = L.point((pa.x + pb.x) / 2 - dy * 0.18, (pa.y + pb.y) / 2 + dx * 0.18);
        const q = s => L.point((1-s)*(1-s)*pa.x + 2*(1-s)*s*c.x + s*s*pb.x, (1-s)*(1-s)*pa.y + 2*(1-s)*s*c.y + s*s*pb.y);
        const pts = []; for (let k = 0; k <= 40; k++) pts.push(E.unproject(q(k / 40)));
        L.polyline(pts, {color, weight:2.5, opacity:.85, dashArray:'2 7', lineCap:'round'}).addTo(m)
          .bindTooltip(`✈ ${seq[i].name} → ${seq[i+1].name}`, {sticky:true});
        const p1 = q(0.48), p2 = q(0.52);
        arrow(q(0.5), ang(p1, p2), true);
        L.marker(E.unproject(q(0.5)), {interactive:false, keyboard:false, icon:L.divIcon({className:'plane', html:'✈', iconSize:[20,20], iconAnchor:[10,24]})}).addTo(m);
      } else {
        const style = how === 'train' ? {weight:4, opacity:.85} : how === 'boat' ? {weight:3, opacity:.8, dashArray:'1 6', lineCap:'round'} : {weight:3, opacity:.75, dashArray:'6 6'};
        L.polyline([a, b], Object.assign({color}, style)).addTo(m);
        arrow(L.point(pa.x + (pb.x - pa.x) * 0.42, pa.y + (pb.y - pa.y) * 0.42), ang(pa, pb), how === 'train');

const OKTYPES = ["image/png","image/jpeg","image/gif","image/webp","application/pdf"];
async function toJpeg(file){
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 3000 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * scale); cv.height = Math.round(bmp.height * scale);
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  const blob = await new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error("encode")), "image/jpeg", 0.88));
  return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", {type:"image/jpeg"});
}
const upMsg = {};
async function uploadFiles(id, fileList){
  if (!ASSETS || !DB) return;
  const files = [...fileList]; if (!files.length) return;
  UPLOADING[id] = true; upMsg[id] = ""; render();
  const cur = Object.assign({files:[]}, BOOKED[id] || {});
  const added = [];
  for (let f of files) {
    let type = f.type;
    // phones: HEIC/HEIF or oversized photos -> re-encode as JPEG in the browser
    if ((/^image\//.test(type) && !OKTYPES.includes(type)) || /\.(heic|heif)$/i.test(f.name) || (/^image\//.test(type) && f.size > 8 * 1024 * 1024)) {
      try { f = await toJpeg(f); type = "image/jpeg"; } catch(e) {}
    }
    if (!type) { const ext = (f.name.split(".").pop() || "").toLowerCase(); type = {pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp"}[ext] || ""; }
    if (!OKTYPES.includes(type)) { upMsg[id] = `「${f.name}」格式不支援，請上傳 JPG、PNG、WebP、GIF 或 PDF（iPhone 的 HEIC 照片請先轉成 JPG 或截圖）`; continue; }
    if (f.size > 20 * 1024 * 1024) { upMsg[id] = `「${f.name}」超過 20 MB，請壓縮後再上傳`; continue; }
    try { const r = await ASSETS.upload(f, {type}); added.push({id:r.id, name:f.name, type, size:r.sizeBytes}); }
    catch(e) { upMsg[id] = e && e.code === "quota_or_state" ? "空間已滿，請先刪掉不需要的附件" : e && e.code === "rate_limited" ? "上傳太頻繁，請稍後再試" : `「${f.name}」上傳失敗，請再試一次`; }
  }
  UPLOADING[id] = false;
  if (added.length) {
    const next = Object.assign({}, cur, {files: (cur.files || []).concat(added)});
    if (!isDone(BOOKINGS.find(x => x.id === id) || {})) { next.done = true; next.at = new Date().toISOString(); }
    await saveBooking(id, next);
  } else render();
}

let viewerData = null;
async function openViewer(id, type, name){

  ov.innerHTML = `<div class="vbar"><b></b><button data-vdl hidden>下載</button><button data-vclose>關閉</button></div><div class="vbody"><div class="vmsg">載入中…</div></div>`;

  const body = ov.querySelector(".vbody");
  try {
    const r = await fetch("/_blob/" + id); if (!r.ok) throw new Error("http " + r.status);
    const buf = await r.arrayBuffer(); viewerData = {buf, name, type};
    window.claude?.use && window.claude.use("downloads").then(d => { if (d && document.getElementById("viewer") === ov) { viewerData.dl = d; ov.querySelector("[data-vdl]").hidden = false; } });

      body.innerHTML = "";
      const w = Math.min(body.clientWidth - 24, 900), dpr = Math.min(window.devicePixelRatio || 1, 2);
      for (let i = 1; i <= pdf.numPages; i++) {
        if (document.getElementById("viewer") !== ov) return;
        const page = await pdf.getPage(i);
        const vp0 = page.getViewport({scale: 1}); const vp = page.getViewport({scale: w / vp0.width * dpr});
        const cv = document.createElement("canvas"); cv.width = vp.width; cv.height = vp.height; cv.style.width = (vp.width / dpr) + "px";

    ${(() => { const ls = LEGS.filter(l => l.day === d.id); return ls.length ? `<div class="sec-t">這天的交通</div><div class="legs">${ls.map(l => legRow(l, false)).join("")}</div>` : ""; })()}
    ${todos.length ? `<div class="sec-t">這天要先訂</div><div class="daytodo">${todos.map(b => todoRow(b, false)).join("")}</div>` : ""}
    <div class="foot-nav">${prev ? `<button data-go="${prev.i}"><small>← ${prev.id} · ${prev.date}</small>${esc(prev.short)}</button>` : ""}${next ? `<button data-go="${next.i}"><small>${next.id} · ${next.date} →</small>${esc(next.short)}</button>` : ""}</div>
  </article></div>`;
}

function routeSvg(){
  const pts = groups.map(g => SEGMENTS[g.seg]);
  const k = 13, cx = Math.cos(55 * Math.PI / 180);
  const lon0 = 0, lat0 = 68.5, W = 230, H = Math.round((lat0 - 40) * k);
  const P = s => [ 30 + (s.lon - lon0) * k * cx * 1.0, (lat0 - s.lat) * k ];
  const xy = pts.map(P);
  const path = xy.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const labels = groups.map((g, i) => {
    const [x, y] = xy[i]; const s = SEGMENTS[g.seg];
    const right = g.seg !== "rom" && g.seg !== "ven" ? x < 120 : false;
    const lx = g.seg === "lap" ? x - 10 : (g.seg === "par" ? x + 10 : x + 10);
    const anchor = g.seg === "lap" ? "end" : "start";
    const dy = g.seg === "flo" ? 4 : (g.seg === "ven" ? -2 : (g.seg === "rom" ? 6 : 4));
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6" fill="${COLORS[g.seg]}" stroke="var(--bg)" stroke-width="2"/>
      <text x="${lx.toFixed(1)}" y="${(y + dy).toFixed(1)}" text-anchor="${anchor}" font-size="12" font-weight="700" fill="var(--ink)">${esc(s.name)}</text>
      <text x="${lx.toFixed(1)}" y="${(y + dy + 14).toFixed(1)}" text-anchor="${anchor}" font-size="10.5" fill="var(--muted)" font-family="var(--f-mono)">${g.days[0].date}–${g.days[g.days.length-1].date}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="路線圖"><path d="${path}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>${labels}</svg>`;
}

function renderOv(){
  const rows = DAYS.map(d => `<button class="ovrow" data-go="${d.i}" data-tabgo="day" style="--c:${d.c}"><span class="dt">${d.date}<small>${d.id} · ${d.wk}</small></span><span><span class="city">${esc(d.city)}</span><div class="acts">${d.plan.map(p => esc(p.title)).join(" · ")}</div></span><span class="stay"><b>住宿</b>${esc(d.stay)}</span></button>`).join("");
  const sum = groups.map(g => `<div style="--c:${COLORS[g.seg]}"><b>${esc(SEGMENTS[g.seg].name)}</b><span>${g.days[0].date}–${g.days[g.days.length-1].date} · ${g.days.length} 天</span></div>`).join("");
  return `<div id="ovmap" class="daymap ovmapbox"></div><div class="maphint">全程路線：✈ 點狀弧線＝飛機，實線＝火車</div><div class="ov"><div class="ovlist">${rows}</div><div class="routebox">${routeSvg()}<div class="cap">台北出發，台北回程。點左邊任一天看詳細。</div><div class="segsum">${sum}</div></div></div>`;
}

function renderTr(){
  const rows = groups.map(g => {
    const ids = g.days.map(d => d.id);
    const ls = LEGS.filter(l => ids.includes(l.day));
    return ls.length ? `<section class="trgroup" style="--c:${COLORS[g.seg]}"><h3>${esc(SEGMENTS[g.seg].name)}<small>${g.days[0].date}–${g.days[g.days.length-1].date}</small></h3><div class="legs">${ls.map(l => legRow(l, true)).join("")}</div></section>` : "";
  }).join("");
  return `<div class="bk"><p class="lead">全程 ${LEGS.length} 段移動，照時間順序排。大部分當天搭就好，要先訂的機票和火車在「預訂與準備」裡。</p>${rows}</div>`;
}

function renderBk(){
  const done = BOOKINGS.length - pendingCount();
  const rank = b => opensInfo(b).open ? 0 : 1;
  const sorted = BOOKINGS.slice().sort((a, b) => rank(a) - rank(b) || (rank(a) === 1 ? opensInfo(a).at - opensInfo(b).at : 0) || (+a.day.slice(1)) - (+b.day.slice(1)));
  const nowOpen = BOOKINGS.filter(b => !isDone(b) && rank(b) === 0).length;
  return `<div class="bk">
  <div class="sec-t" style="margin-top:4px">要預訂的 ${BOOKINGS.length} 項</div>
  <div class="prog"><span>${done} / ${BOOKINGS.length} 已訂・${nowOpen} 項現在就能訂</span><div class="bar"><span style="width:${BOOKINGS.length ? done / BOOKINGS.length * 100 : 0}%"></span></div></div>
  ${DB && !ASSETS && ASSETS_CHECKED ? `<p class="upnote">這個裝置或帳號目前不能上傳檔案：只有擁有者和編輯者可以上傳；如果是手機 App 不支援，請改用電腦，或用手機瀏覽器登入 claude.ai 開啟。</p>` : ""}
  <div class="list">${sorted.map(b => todoRow(b, true)).join("")}</div>
  <p class="note">買好一項就點左邊的框框打勾，打勾後位置不會變；${ASSETS && DB ? "每一項都可以上傳確認信或票券（圖片或 PDF），上傳後會自動打勾。" : ""}${esc(tickWhere)}。排序：現在就能訂的在最上面，接著是還沒開放的（依開放日期）。</p>
  <div class="sec-t">導遊與跟團</div>
  <div class="prep">${GUIDES.map(g => `<div><dt>${esc(g.t)}<span class="need">${esc(g.need)}</span></dt><dd>${esc(g.d)}</dd></div>`).join("")}</div>
  <div class="sec-t">出發前準備</div>
  <div class="prep">${PREP.map(p => `<div><dt>${esc(p.t)}</dt><dd>${esc(p.d)}</dd></div>`).join("")}</div>
  </div>`;
}

function renderUg(){
  const secs = UG_LEVELS.map(L => {
    const list = BOOKINGS.filter(b => URGENT[b.id] && URGENT[b.id][0] === L.k);
    if (!list.length) return "";
    const left = list.filter(b => !isDone(b)).length;
    const rows = list.map(b => {
      const row = todoRow(b, true);
      return row.replace('<div><span class="itm">', `<div><span class="why">${esc(URGENT[b.id][1])}</span><span class="itm">`);
    }).join("");
    return `<section class="ugsec ug-${L.k}"><h3>${esc(L.t)}<small>${left ? `還有 ${left} 項` : "全部訂好了 ✓"}</small></h3><p class="ugd">${esc(L.d)}</p><div class="list">${rows}</div></section>`;
  }).join("");
  return `<div class="bk"><p class="lead">機票不列在這裡。訂好就打勾，位置不會變。</p>${secs}</div>`;
}

function renderSv(){
  const cur = COUNTRIES.find(c => c.k === state.country) || COUNTRIES[0];
  const tabs = COUNTRIES.map(c => `<button class="ctab" data-country="${esc(c.k)}" style="--c:${COLORS[c.seg]}" aria-selected="${c.k === cur.k}">${esc(c.k)}<span class="n">${REFS.filter(r => r.country === c.k).length}</span></button>`).join("");
  const list = REFS.filter(r => r.country === cur.k);
  const card = r => {
    const items = r.items && r.items.length ? `<ul>${r.items.map(it => `<li><b>${esc(it.n)}</b>${it.d ? ` <small>${esc(it.d)}</small>` : ""}${it.map ? ` <a class="maplink" href="${mapUrl(it.map)}" target="_blank" rel="noopener">地圖</a>` : ""}</li>`).join("")}</ul>` : "";
    return `<div class="ref" style="--c:${COLORS[cur.seg]}"><div class="ref-top"><span class="mode">${esc(r.type)}</span><b>${esc(r.title)}</b></div>
      <div class="rn">${esc(r.area)}${r.note ? "・" + esc(r.note) : ""}</div>${items}
      ${r.pending ? `<div class="pend">${esc(r.pending)}</div>` : ""}
      ${r.url ? `<a class="src" href="${esc(r.url)}" target="_blank" rel="noopener">看原文（${esc(r.src || "連結")}）</a>` : ""}</div>`;
  };
  return `<div class="bk"><p class="lead">從 IG、文章收藏的推薦，依國家分類，方便回顧。</p><div class="ctabs" role="tablist">${tabs}</div>
  ${list.length ? `<div class="refs">${list.map(card).join("")}</div>` : `<div class="empty">${esc(cur.k)}還沒有收藏的指南。</div>`}</div>`;
}

function render(){
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === state.tab));
  const main = document.getElementById("main");
  main.innerHTML = state.tab === "day" ? renderDay() : state.tab === "ov" ? renderOv() : state.tab === "tr" ? renderTr() : state.tab === "sv" ? renderSv() : state.tab === "ug" ? renderUg() : renderBk();
  { const n = BOOKINGS.filter(b => URGENT[b.id] && URGENT[b.id][0] === "now" && !isDone(b)).length; document.getElementById("ugCount").textContent = n || "✓"; }
  document.getElementById("svCount").textContent = REFS.length || "";
  renderStrip();
  drawMaps();
  store.set("hm-day", state.day); store.set("hm-tab", state.tab); store.set("hm-country", state.country);
}
function go(i, toDay){
  if (i < 0 || i >= DAYS.length) return;
  state.day = i; if (toDay) state.tab = "day";
  render();
  const mainTop = document.getElementById("main").getBoundingClientRect().top + scrollY - 120;
  if (scrollY > mainTop) scrollTo({top: Math.max(0, mainTop), behavior: "smooth"});
}
document.addEventListener("click", e => {
  const vw = e.target.closest("[data-view]"); if (vw) { e.preventDefault(); const [id, type, ...n] = vw.dataset.view.split("|"); openViewer(id, type, n.join("|")); return; }
  if (e.target.closest("[data-vclose]")) { closeViewer(); return; }
  if (e.target.closest("[data-vdl]")) { downloadViewer(); return; }
  const tk = e.target.closest("[data-tick]"); if (tk) { toggleBooked(tk.dataset.tick); return; }
  const fd = e.target.closest("[data-fdel]"); if (fd) { const [bid, fid] = fd.dataset.fdel.split("|"); removeFile(bid, fid); return; }
  const ct = e.target.closest("[data-country]"); if (ct) { state.country = ct.dataset.country; render(); return; }
  const tab = e.target.closest(".tab"); if (tab) { state.tab = tab.dataset.tab; render(); return; }
  const g = e.target.closest("[data-go]"); if (g) go(+g.dataset.go, true);
});
document.addEventListener("change", e => {
  const inp = e.target.closest && e.target.closest("input[data-up]");
  if (inp && inp.files) uploadFiles(inp.dataset.up, inp.files);
});
document.addEventListener("keydown", e => {
  if (state.tab !== "day" || e.target.closest("input,textarea")) return;
  if (e.key === "ArrowRight") go(state.day + 1); if (e.key === "ArrowLeft") go(state.day - 1);
});
// swipe on day view (phones)
let sx = null, sy0 = null;
document.getElementById("main").addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy0 = e.touches[0].clientY; }, {passive:true});
document.getElementById("main").addEventListener("touchend", e => {
  if (sx === null || state.tab !== "day") return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy0; sx = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8) go(state.day + (dx < 0 ? 1 : -1));
}, {passive:true});
render();
</script>

</body>
